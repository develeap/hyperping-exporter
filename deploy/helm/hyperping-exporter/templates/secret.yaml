{{- $es := .Values.externalSecret | default dict -}}
{{- if .Values.config.projects }}
{{- /*
Multi-project mode. The chart-managed Secret always carries the
projects.yaml document (mounted at /etc/hyperping/projects.yaml). When
any project sets inline apiKey (dev mode), the same Secret also carries
one `api-key-<id>` data entry per inline project; the deployment.yaml
projected-volume template surfaces those entries at
/etc/hyperping/api-key-<id>. External-source projects (existingSecret /
ESO) contribute their own Secret references through the projected
volume's additional sources.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hyperping-exporter.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hyperping-exporter.labels" . | nindent 4 }}
type: Opaque
data:
  projects.yaml: {{ include "hyperping-exporter.projectsYaml" . | b64enc | quote }}
  {{- range $p := .Values.config.projects }}
  {{- if $p.apiKey }}
  api-key-{{ $p.id }}: {{ $p.apiKey | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- else if and .Values.config.apiKey (not .Values.config.existingSecret) (not $es.enabled) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hyperping-exporter.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hyperping-exporter.labels" . | nindent 4 }}
type: Opaque
data:
  api-key: {{ .Values.config.apiKey | b64enc | quote }}
{{- end }}
