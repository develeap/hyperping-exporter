{{- $es := .Values.externalSecret | default dict -}}
{{- if $es.enabled }}
{{- include "hyperping-exporter.validateExternalSecretApiVersion" . -}}
{{- include "hyperping-exporter.validateExternalSecretStoreKind" . -}}
{{- if not (and $es.secretStoreRef $es.secretStoreRef.name) }}
{{- fail "externalSecret.secretStoreRef.name is required when externalSecret.enabled is true. Set externalSecret.secretStoreRef.name to a (Cluster)SecretStore name and externalSecret.secretStoreRef.kind to SecretStore or ClusterSecretStore." }}
{{- end }}
apiVersion: {{ $es.apiVersion | default "external-secrets.io/v1beta1" }}
kind: ExternalSecret
metadata:
  name: {{ include "hyperping-exporter.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hyperping-exporter.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval | default "1h" | quote }}
  secretStoreRef:
    name: {{ $es.secretStoreRef.name }}
    kind: {{ $es.secretStoreRef.kind | default "SecretStore" }}
  target:
    {{- if .Values.config.projects }}
    # Multi-project mode: the target Secret carries one `api-key-<id>`
    # data entry per project. The deployment.yaml projected-volume
    # template re-keys these into /etc/hyperping/api-key-<id> alongside
    # the chart-managed Secret's projects.yaml. A separate `-projects`
    # target Secret keeps the chart-managed Secret (projects.yaml) and
    # the ESO-managed Secret (api keys) ownership boundaries clean.
    name: {{ include "hyperping-exporter.fullname" . }}-projects
    {{- else }}
    name: {{ include "hyperping-exporter.fullname" . }}
    {{- end }}
    creationPolicy: {{ $es.creationPolicy | default "Owner" }}
  data:
    {{- if .Values.config.projects }}
    {{- range $p := .Values.config.projects }}
    {{- $pEs := $p.externalSecret | default dict }}
    {{- $rr := $pEs.remoteRef | default dict }}
    - secretKey: api-key-{{ $p.id }}
      remoteRef:
        key: {{ $rr.key | required (printf "projects[id=%s].externalSecret.remoteRef.key is required when externalSecret.enabled is true and config.projects is set." $p.id) }}
        {{- if $rr.property }}
        property: {{ $rr.property }}
        {{- end }}
        {{- if $rr.version }}
        version: {{ $rr.version }}
        {{- end }}
    {{- end }}
    {{- else }}
    - secretKey: api-key
      remoteRef:
        key: {{ $es.remoteRef.key | required "externalSecret.remoteRef.key is required when externalSecret.enabled is true." }}
        {{- if $es.remoteRef.property }}
        property: {{ $es.remoteRef.property }}
        {{- end }}
        {{- if $es.remoteRef.version }}
        version: {{ $es.remoteRef.version }}
        {{- end }}
    {{- end }}
{{- end }}
