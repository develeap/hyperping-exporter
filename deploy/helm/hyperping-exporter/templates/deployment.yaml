{{- include "hyperping-exporter.validateNoTestKeys" . -}}
{{- include "hyperping-exporter.validateCacheTTL" . -}}
{{- include "hyperping-exporter.validateCacheMode" . -}}
{{- include "hyperping-exporter.validateTierTTLs" . -}}
{{- include "hyperping-exporter.validateProjectsCacheBlocks" . -}}
{{- include "hyperping-exporter.validateReplicaCount" . -}}
{{- include "hyperping-exporter.validateSecretSources" . -}}
{{- include "hyperping-exporter.validateProjects" . -}}
{{- include "hyperping-exporter.validateWebConfigFile" . -}}
{{- include "hyperping-exporter.validateOtlpProtocol" . -}}
{{- include "hyperping-exporter.validateOtlpInterval" . -}}
{{- include "hyperping-exporter.validateDisableMetricsEndpoint" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hyperping-exporter.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hyperping-exporter.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "hyperping-exporter.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hyperping-exporter.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- if not .Values.config.disableMetricsEndpoint }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.service.port | quote }}
        prometheus.io/path: {{ .Values.config.metricsPath | quote }}
        {{- end }}
        {{- if .Values.config.projects }}
        # checksum of the rendered projects.yaml so a chart upgrade that
        # changes the project list (or any per-project field that flows
        # into the mounted document) triggers a Pod rollout. Note this
        # does NOT catch external Secret rotations: kubelet updates the
        # projected volume on disk (~60s) but the exporter has already
        # read p.APIKey at boot, so rotating an externally-managed key
        # still requires `kubectl rollout restart deploy/<name>`.
        checksum/projects-yaml: {{ include "hyperping-exporter.projectsYaml" . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - {{ include "hyperping-exporter.arg" (list "--listen-address" (printf ":%v" .Values.service.port)) }}
            - {{ include "hyperping-exporter.arg" (list "--metrics-path" .Values.config.metricsPath) }}
            - {{ include "hyperping-exporter.arg" (list "--cache-ttl" .Values.config.cacheTTL) }}
            - {{ include "hyperping-exporter.arg" (list "--log-level" .Values.config.logLevel) }}
            - {{ include "hyperping-exporter.arg" (list "--log-format" .Values.config.logFormat) }}
            {{- /*
              config.webConfigFile (TLS mode) is currently gated off by
              validateWebConfigFile (R10): the chart's probes and
              ServiceMonitor hardcode HTTP, so enabling TLS would
              produce a permanently-NotReady pod. The validator
              fail()s before this template would render the arg. The
              arg-rendering line stays out of the template until the
              chart wires httpGet.scheme + ServiceMonitor scheme +
              tlsConfig coherently.
            */}}
            {{- if .Values.config.namespace }}
            - {{ include "hyperping-exporter.arg" (list "--namespace" .Values.config.namespace) }}
            {{- end }}
            {{- if .Values.config.excludeNamePattern }}
            - {{ include "hyperping-exporter.arg" (list "--exclude-name-pattern" .Values.config.excludeNamePattern) }}
            {{- end }}
            {{- if .Values.config.mcpUrl }}
            - {{ include "hyperping-exporter.arg" (list "--mcp-url" .Values.config.mcpUrl) }}
            {{- end }}
            {{- if (.Values.otlp | default dict).endpoint }}
            - {{ include "hyperping-exporter.arg" (list "--otlp-endpoint" .Values.otlp.endpoint) }}
            - {{ include "hyperping-exporter.arg" (list "--otlp-protocol" .Values.otlp.protocol) }}
            {{- if .Values.otlp.headers }}
            - {{ include "hyperping-exporter.arg" (list "--otlp-headers" .Values.otlp.headers) }}
            {{- end }}
            - {{ include "hyperping-exporter.arg" (list "--otlp-interval" .Values.otlp.interval) }}
            {{- if .Values.otlp.insecure }}
            - {{ include "hyperping-exporter.arg" (list "--otlp-insecure" .Values.otlp.insecure) }}
            {{- end }}
            {{- end }}
            {{- $cacheMode := .Values.config.cacheMode | default "legacy" }}
            {{- if eq (lower $cacheMode) "tiered" }}
            - {{ include "hyperping-exporter.arg" (list "--cache-mode" "tiered") }}
            - {{ include "hyperping-exporter.arg" (list "--hot-ttl" .Values.config.hotTTL) }}
            - {{ include "hyperping-exporter.arg" (list "--warm-ttl" .Values.config.warmTTL) }}
            - {{ include "hyperping-exporter.arg" (list "--cold-ttl" .Values.config.coldTTL) }}
            {{- end }}
            {{- if .Values.config.projects }}
            - {{ include "hyperping-exporter.arg" (list "--projects-file" "/etc/hyperping/projects.yaml") }}
            {{- end }}
            {{- if .Values.config.disableMetricsEndpoint }}
            - {{ include "hyperping-exporter.arg" (list "--disable-metrics-endpoint" .Values.config.disableMetricsEndpoint) }}
            {{- end }}
          {{- if and (not .Values.config.projects) (gt (int (include "hyperping-exporter.secretSourceCount" .)) 0) }}
          env:
            - name: HYPERPING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "hyperping-exporter.secretName" . }}
                  key: api-key
          {{- end }}
          {{- if not .Values.config.disableMetricsEndpoint }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if or (.Values.tmpfs | default dict).enabled .Values.config.projects }}
          volumeMounts:
            {{- if (.Values.tmpfs | default dict).enabled }}
            - name: tmp
              mountPath: /tmp
            {{- end }}
            {{- if .Values.config.projects }}
            - name: projects-file
              mountPath: /etc/hyperping
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if or (.Values.tmpfs | default dict).enabled .Values.config.projects }}
      volumes:
        {{- if (.Values.tmpfs | default dict).enabled }}
        - name: tmp
          emptyDir:
            {{- with .Values.tmpfs.medium }}
            medium: {{ . | quote }}
            {{- end }}
            {{- with .Values.tmpfs.sizeLimit }}
            sizeLimit: {{ . | quote }}
            {{- end }}
        {{- end }}
        {{- if .Values.config.projects }}
        # Projected volume composes the chart-managed Secret holding
        # projects.yaml with each per-project Secret (inline-mode entries
        # in the chart Secret; existingSecret or ESO target Secrets
        # referenced by name) so /etc/hyperping/projects.yaml and
        # /etc/hyperping/api-key-<id> are all available off one mount.
        - name: projects-file
          projected:
            sources:
              - secret:
                  name: {{ include "hyperping-exporter.fullname" . }}
                  items:
                    - key: projects.yaml
                      path: projects.yaml
                  {{- /*
                    Inline-mode api-key entries live on the chart-managed
                    Secret alongside projects.yaml. Under ESO mode the
                    range body still runs but the inner `if $p.apiKey`
                    is false on every project (validateProjects rejects
                    inline apiKey under ESO), so the chart-managed
                    Secret only carries projects.yaml in that branch.
                  */}}
                  {{- range $p := .Values.config.projects }}
                  {{- if $p.apiKey }}
                    - key: api-key-{{ $p.id }}
                      path: api-key-{{ $p.id }}
                  {{- end }}
                  {{- end }}
              {{- $es := .Values.externalSecret | default dict }}
              {{- if $es.enabled }}
              # ESO mode: the per-project api keys live on the target Secret
              # populated by the ExternalSecret. The target Secret name matches
              # the chart's fullname (see externalsecret.yaml target.name).
              - secret:
                  name: {{ include "hyperping-exporter.fullname" . }}-projects
                  items:
                  {{- range $p := .Values.config.projects }}
                    - key: api-key-{{ $p.id }}
                      path: api-key-{{ $p.id }}
                  {{- end }}
              {{- else }}
              {{- range $p := .Values.config.projects }}
              {{- if $p.existingSecret }}
              # Per-project existing Secret: re-key its `api-key` entry
              # so the projects.yaml apiKeyFile path resolves.
              - secret:
                  name: {{ $p.existingSecret }}
                  items:
                    - key: api-key
                      path: api-key-{{ $p.id }}
              {{- end }}
              {{- end }}
              {{- end }}
        {{- end }}
      {{- end }}
      terminationGracePeriodSeconds: 15
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
