# Multi-project + ESO + per-project existingSecret: validateProjects must
# reject this because the deployment.yaml projected-volume template skips
# the existingSecret branch entirely under ESO mode, and the operator's
# choice of a pre-existing Secret would otherwise be silently lost.
config:
  projects:
    - id: hyp_core
      externalSecret:
        remoteRef:
          key: kv/hyperping/dev_exporter_core
          property: api-key
    - id: hyp_infra
      existingSecret: pre-existing-infra-secret
externalSecret:
  enabled: true
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
