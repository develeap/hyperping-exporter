# Multi-project + ESO fixture: when externalSecret.enabled is true and
# config.projects is non-empty, the chart MUST render one ExternalSecret
# data entry per project (secretKey=api-key-<id>) so a single target
# Secret carries every project's key.
config:
  projects:
    - id: hyp_core
      externalSecret:
        remoteRef:
          key: kv/hyperping/dev_exporter_core
          property: api-key
    - id: hyp_infra
      externalSecret:
        remoteRef:
          key: kv/hyperping/dev_exporter_infra
          property: api-key
externalSecret:
  enabled: true
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
